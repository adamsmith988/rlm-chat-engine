# Deployment source of truth. Python services read these via env (existing
# process environment always wins). Do not put model names in source code.

env:
  DEFAULT_CHAT_ORCHESTRATOR: rlm
  DOCK_CHAT_ORCHESTRATOR: rlm
  STRICT_LLM_BINDINGS: true
  LLM_ENABLE_THINKING: false
  TOOL_PERMISSION_ENFORCEMENT: false
  TOOL_RUNNER_RBAC_ENABLED: false
  AUTH_SERVICE_URL: ""
  ALLOW_INSECURE_DEFAULTS: true
  MEMORY_ENABLED: true
  SESSION_COMPACT_ENABLED: true
  SELF_COMPACT_ENABLED: true
  TASK_HANDOFF_AUTO_CONTINUE: true
  SKILLS_ENABLED: true
  LLM_PROXY_URL: http://127.0.0.1:8005
  TOOL_RUNNER_URL: http://127.0.0.1:8002
  STORAGE_URL: http://127.0.0.1:8004
  QDRANT_URL: http://127.0.0.1:6333
  REDIS_URL: redis://127.0.0.1:6379/0
  DATABASE_URL: postgresql://rlm:rlm_pass@127.0.0.1:5432/rlm
  TOOLS_MODULE_PATH: modules/tools
  PLUGINS_MODULE_PATH: modules/plugins
  INTERNAL_API_KEY: change-me-before-gpu-bringup
  CORS_ALLOW_ORIGINS: "*"

models:
  chat:
    logical_id: chat
    hf_id: openbmb/MiniCPM5-2B
    served_name: minicpm5-2b
    context_length: 16384
    max_len: 16384
    tool_call_parser: hermes
  embed:
    logical_id: embed
    hf_id: BAAI/bge-small-en-v1.5
    served_name: memory-embed
    context_length: 512

skills:
  markdown_dir: skills
  workspace_copy_subdir: skills

loops:
  default_mode: turn_based
  goal_max_turns: 40
  turn_max_turns: 12
  heartbeat_default_sec: 300
  proactive_heartbeat_sec: 3600

ui:
  public_orchestrator_url: http://127.0.0.1:8001
  public_storage_url: http://127.0.0.1:8004
  title: RLM Chat

llm_d:
  cluster_name: rlm-llmd
  namespace: llm-d
  gateway_service: llm-d-inference-gateway
  gateway_port: 8000
  vllm_served_name_env: CHAT_MODEL_SERVED_NAME
  gpu_required: true
  no_host_fallback: true

vllm:
  host: llm-d-inference-gateway.llm-d.svc.cluster.local
  port: 8000
  openai_path: /v1

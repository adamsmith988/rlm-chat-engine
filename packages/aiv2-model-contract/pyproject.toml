[project]
name = "aiv2-model-contract"
version = "0.1.0"
description = "Shared model/runtime contract helpers for AIv2 mother and aiv2_node"
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiv2_model_contract = ["data/*", "py.typed"]

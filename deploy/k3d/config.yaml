# Isolated k3s-in-Docker. Never applied to the existing AIv2 k3s context.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: rlm-llmd
servers: 1
agents: 0
image: rancher/k3s:v1.31.4-k3s1
kubeAPI:
  host: "127.0.0.1"
  hostIP: "127.0.0.1"
  hostPort: "16551"
ports:
  - port: 18000:30080
    nodeFilters:
      - server:0
volumes:
  - volume: /home/iii/.cache/huggingface:/huggingface
    nodeFilters:
      - server:0
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  kubeconfig:
    updateDefaultKubeconfig: false

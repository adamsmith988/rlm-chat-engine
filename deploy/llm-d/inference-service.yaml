# llm-d + vLLM serving skeleton. Images, GPU requests, and model ids are
# substituted from ConfigMap / env at bring-up. This file is not applied now.
apiVersion: v1
kind: Service
metadata:
  name: llm-d-inference-gateway
  namespace: llm-d
spec:
  selector:
    app: llm-d-inference-gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-d-vllm
  namespace: llm-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-d-inference-gateway
  template:
    metadata:
      labels:
        app: llm-d-inference-gateway
    spec:
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - --model
            - $(CHAT_MODEL_HF_ID)
            - --served-model-name
            - $(CHAT_MODEL_SERVED_NAME)
            - --enable-auto-tool-choice
            - --tool-call-parser
            - $(CHAT_TOOL_CALL_PARSER)
          envFrom:
            - configMapRef:
                name: rlm-model-config
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: "1"
